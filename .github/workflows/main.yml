
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -o BollenStapelenAutoPlayer-prototype.zip

      - name: Build APK
        run: gradle assembleDebug
        working-directory: BollenStapelenAutoPlayer

      - uses: actions/upload-artifact@v4
        with:
          name: Bollen-Auto-Player
          path: BollenStapelenAutoPlayer/app/build/outputs/apk/debug/app-debug.apk
