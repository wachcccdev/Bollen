
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -o BollenStapelenAutoPlayer-crashfix.zip
        
      - name: Fix Java and Kotlin versions
        run: |
          cat > BollenStapelenAutoPlayer/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "nl.wachccc.bollenstapelen"
              compileSdk = 35

              defaultConfig {
                  applicationId = "nl.wachccc.bollenstapelen"
                  minSdk = 30
                  targetSdk = 35
                  versionCode = 1
                  versionName = "0.1-prototype"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug
        working-directory: BollenStapelenAutoPlayer

      - uses: actions/upload-artifact@v4
        with:
          name: Bollen-Auto-Player
          path: BollenStapelenAutoPlayer/app/build/outputs/apk/debug/app-debug.apk
